[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndh_demo"
version = "0.1.0"
description = "A functional demonstration of the Non-Deterministic Hypergraph (NDH) continuous geometric control layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-Humanitarian-Bounded-Non-Harm" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Security :: Cryptography"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "mypy>=1.5.0"
]

[project.scripts]
ndh-run = "ndh_demo.engine:main"
ndh-verify = "ndh_demo.interceptor:verify_all"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ndh_demo*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
